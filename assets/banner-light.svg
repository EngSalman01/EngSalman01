<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Salman Almnaseer — Software Engineer">
  <defs>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#059669"/><stop offset="1" stop-color="#0284c7"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.2" r="0.6">
      <stop offset="0" stop-color="#0284c7" stop-opacity="0.22"/><stop offset="1" stop-color="#0284c7" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#d1d9e0"/>
    </pattern>
    <clipPath id="r"><rect width="1200" height="320" rx="24"/></clipPath>
  </defs>
  <g clip-path="url(#r)">
    <rect width="1200" height="320" fill="#ffffff"/>
    <rect x="760" y="0" width="440" height="320" fill="url(#dots)"/>
    <rect width="1200" height="320" fill="url(#glow)"/>
    <g transform="translate(905 160)" fill="none" stroke="url(#acc)" stroke-width="2">
      <circle r="110" opacity="0.35"/>
      <circle r="78" opacity="0.6"/>
      <circle r="46">
        <animate attributeName="r" values="44;50;44" dur="6s" repeatCount="indefinite"/>
      </circle>
      <path d="M-150 0 H150 M0 -150 V150" opacity="0.18"/>
    </g>
    <g transform="translate(905 160)">
      <rect x="-26" y="-18" width="52" height="36" rx="8" fill="#f6f8fa" stroke="url(#acc)" stroke-width="2"/>
      <text x="0" y="6" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="700" fill="#1f2328">&lt;/&gt;</text>
    </g>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="319" rx="24" fill="none" stroke="#d1d9e0"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <rect x="64" y="70" width="44" height="4" rx="2" fill="url(#acc)"/>
    <text x="120" y="77" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" letter-spacing="3" fill="#59636e">SOFTWARE ENGINEER</text>
    <text x="62" y="152" font-size="64" font-weight="800" letter-spacing="-1.5" fill="#1f2328">Salman Almnaseer</text>
    <text x="64" y="198" font-size="24" fill="#59636e">Full-stack web apps · AI · Arabic-first products</text>
    <text x="64" y="256" font-size="17" fill="#59636e">
      <tspan fill="url(#acc)" font-weight="700">●</tspan>
      <tspan dx="6">Al Khobar, Saudi Arabia  ·  Open to roles across the GCC</tspan>
    </text>
  </g>
</svg>
